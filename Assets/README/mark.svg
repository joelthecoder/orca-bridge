<svg xmlns="http://www.w3.org/2000/svg" id="orca-bridge-mark" width="256" height="256" viewBox="0 0 256 256" role="graphics-document document" aria-labelledby="mark-title" aria-describedby="mark-description">
  <title id="mark-title">Orca Bridge mark</title>
  <desc id="mark-description">Two interwoven teal and indigo bands form a continuous connection.</desc>
